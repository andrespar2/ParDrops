name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un solo despliegue a la vez: si llegan dos pushes seguidos, el segundo espera
# en lugar de publicar dos versiones en paralelo.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  backend:
    name: Desplegar API en Render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verificar el backend antes de publicar
        working-directory: pardrops
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Disparar el despliegue en Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "Faltan los secretos RENDER_API_KEY o RENDER_SERVICE_ID." >&2
            exit 1
          fi
          curl --fail --silent --show-error \
            -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}' > deploy.json
          echo "Despliegue solicitado a Render:"
          cat deploy.json

  frontend:
    name: Desplegar frontend en Cloudflare Pages
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pardropsfrontend/package-lock.json

      - name: Instalar dependencias
        working-directory: pardropsfrontend
        run: npm ci

      - name: Compilar con la URL de la API de producción
        working-directory: pardropsfrontend
        env:
          PARDROPS_API_URL: ${{ vars.PARDROPS_API_URL }}
        run: npm run build:pages

      - name: Publicar en Cloudflare Pages
        working-directory: pardropsfrontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist/pardropsfrontend/browser --project-name=pardrops --branch=main
