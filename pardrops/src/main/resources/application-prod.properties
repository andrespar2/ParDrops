# ============================================================================
# Perfil de producción (Render + Neon PostgreSQL)
# ============================================================================
# Se activa con SPRING_PROFILES_ACTIVE=prod. Todo lo que aparece aquí tiene un
# equivalente en variables de entorno para no guardar secretos en el repo.
# ============================================================================

# ----------------------------------------------------------------------------
# Base de datos
# ----------------------------------------------------------------------------
# La URL, el usuario y la contraseña llegan por entorno:
#   SPRING_DATASOURCE_URL / DATABASE_URL
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
#
# El esquema se mantiene con Hibernate (las migraciones de datos idempotentes
# del proyecto se ejecutan al arrancar) y el pool se ajusta al plan gratuito
# de Neon, que limita las conexiones simultáneas.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1200000

# La consola H2 no debe quedar expuesta en producción.
spring.h2.console.enabled=false

# ----------------------------------------------------------------------------
# Servidor detrás del proxy de Render
# ----------------------------------------------------------------------------
# Render termina TLS y reenvía la petición: hay que confiar en las cabeceras
# X-Forwarded-* para generar URLs absolutas correctas (por ejemplo /media).
server.forward-headers-strategy=framework
server.compression.enabled=true
server.compression.min-response-size=1024

# ----------------------------------------------------------------------------
# Cookies y OAuth2
# ----------------------------------------------------------------------------
# En producción el flujo de Google viaja por HTTPS: las cookies deben llevar
# Secure y SameSite=None para sobrevivir al salto entre dominios.
app.oauth2.secure-cookies=${APP_OAUTH2_SECURE_COOKIES:true}
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true

# ----------------------------------------------------------------------------
# Almacenamiento de imágenes
# ----------------------------------------------------------------------------
# En Render el sistema de archivos es efímero. Sin almacenamiento externo, el
# contenido se guarda también en PostgreSQL para que sobreviva a un
# redespliegue. Si se configura Cloudflare R2 (APP_MEDIA_STORAGE=r2 + R2_*),
# los bytes salen de la base de datos y se sirven por CDN.
app.media.storage-dir=${APP_MEDIA_STORAGE_DIR:./data/media}

# ----------------------------------------------------------------------------
# Registro
# ----------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.pardorps.pardrops=INFO
logging.level.org.hibernate.SQL=WARN
