# ============================================================================
# Configuración de la aplicación ParDrops (backend Spring Boot)
# ============================================================================

# Nombre lógico de la aplicación.
spring.application.name=pardrops

# ----------------------------------------------------------------------------
# Servidor HTTP
# ----------------------------------------------------------------------------
server.port=${PORT:8080}

# ----------------------------------------------------------------------------
# Base de datos
# ----------------------------------------------------------------------------
# Por defecto se usa H2 en archivo (desarrollo local): ./data/pardropsdb.mv.db.
# En producción la conexión llega por variables de entorno, bien como
# SPRING_DATASOURCE_URL (jdbc:postgresql://...) o como DATABASE_URL con el
# formato que entrega Neon (postgresql://...), que se adapta al arrancar.
#
#   SPRING_DATASOURCE_URL / DATABASE_URL
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/pardropsdb;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# La consola web de H2 para inspeccionar datos en local. El perfil prod la
# desactiva porque en producción no debe quedar expuesta.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Si el driver no se indica, Spring Boot lo deduce de la URL de conexión.

# ----------------------------------------------------------------------------
# JPA / Hibernate
# ----------------------------------------------------------------------------
# "update" crea/actualiza el esquema automáticamente a partir de las entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# open-in-view=false: fuerza a cargar las relaciones perezosas dentro de la
# transacción del servicio, evitando consultas accidentales durante la
# serialización de la respuesta.
spring.jpa.open-in-view=false

# ----------------------------------------------------------------------------
# Seguridad / JWT
# ----------------------------------------------------------------------------
# Clave secreta usada para firmar los tokens (mínimo 32 caracteres para HS256).
# La clave real se inyecta con la variable de entorno APP_JWT_SECRET. El valor
# por defecto solo sirve para desarrollo local y NUNCA debe usarse en producción:
# si se despliega sin definir APP_JWT_SECRET, la aplicación arranca con la clave
# de desarrollo, por lo que hay que vigilarla en el despliegue.
app.jwt.secret=${APP_JWT_SECRET:ClaveDeDesarrolloLocalParDrops2026NoUsarEnProduccion}
# Validez del token: 24 horas (86.400.000 ms).
app.jwt.expiration-ms=86400000

# ----------------------------------------------------------------------------
# CORS: orígenes permitidos para el frontend Angular en desarrollo.
# ----------------------------------------------------------------------------
# CORS: orígenes permitidos para el frontend Angular. En producción se define
# con APP_CORS_ALLOWED_ORIGINS (lista separada por comas).
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4000}

# ----------------------------------------------------------------------------
# Marketplace: solicitudes para vender
# ----------------------------------------------------------------------------
# Días que deben pasar desde que se rechaza una solicitud para poder enviar
# una nueva. Evita que el cliente reintente sin corregir lo que motivó la
# decisión.
app.seller-application.retry-days=7

# Comisión de la plataforma sobre el subtotal de productos de cada venta.
app.marketplace.commission-rate=0.05

# ----------------------------------------------------------------------------
# Multimedia: almacenamiento de las imagenes subidas
# ----------------------------------------------------------------------------
# Directorio del sistema de archivos donde se guardan las imagenes. Es una
# carpeta persistente del proyecto (no la carpeta temporal del servidor), de
# modo que las imagenes sobreviven a un reinicio.
app.media.storage-dir=${APP_MEDIA_STORAGE_DIR:./data/media}

# Ruta publica con la que se sirven las imagenes guardadas.
app.media.public-path=/media

# Tamano maximo admitido por imagen (5 MB) y formatos permitidos. El tipo real
# del fichero se comprueba por su contenido, no por la extension.
app.media.max-size-bytes=5242880
app.media.allowed-types=image/jpeg,image/png,image/webp,image/gif

# Limite de Spring Boot para las peticiones multipart. Es algo mayor que
# app.media.max-size-bytes para que el rechazo lo haga el servicio con un
# mensaje claro y no la infraestructura.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=8MB

# ----------------------------------------------------------------------------
# Acceso con Google (opcional)
# ----------------------------------------------------------------------------
# Se habilita al definir GOOGLE_CLIENT_ID y GOOGLE_CLIENT_SECRET en el entorno.
# Sin esas variables la aplicación arranca normalmente y el resto de accesos
# sigue funcionando. El redirect URI debe coincidir con el registrado en Google
# Cloud Console: http://localhost:8080/login/oauth2/code/google
app.oauth2.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}
app.oauth2.success-path=/auth/callback
app.oauth2.failure-path=/login
app.oauth2.code-ttl-seconds=120
app.oauth2.secure-cookies=${APP_OAUTH2_SECURE_COOKIES:false}
# Host cuyo tráfico se redirige al frontend canónico (apex sin CNAME posible).
# En producción: APP_REDIRECT_APEX_HOST=pardrops.qd.je
app.redirect.apex-host=${APP_REDIRECT_APEX_HOST:}

# ----------------------------------------------------------------------------
# Correo transaccional
# ----------------------------------------------------------------------------
# Por defecto los correos se guardan en ./data/mail-outbox para poder revisarlos
# sin configurar un servidor. Define MAIL_ENABLED=true para enviarlos por SMTP.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@pardrops.local}
app.mail.from-name=${MAIL_FROM_NAME:ParDrops}
app.mail.outbox-dir=${MAIL_OUTBOX_DIR:./data/mail-outbox}
# URL pública del frontend para los enlaces de los correos.
app.mail.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}

# ----------------------------------------------------------------------------
# Semilla inicial
# ----------------------------------------------------------------------------
# Cuenta de administrador creada la primera vez que arranca la aplicación.
# En producción define APP_SEED_ADMIN_EMAIL y APP_SEED_ADMIN_PASSWORD.
app.seed.admin-email=${APP_SEED_ADMIN_EMAIL:admin@pardrops.com}
app.seed.admin-password=${APP_SEED_ADMIN_PASSWORD:admin123}
# Interruptor general: útil para crear el esquema sin datos antes de importar
# una base existente.
app.seed.enabled=${APP_SEED_ENABLED:true}
# Catálogo de demostración (productos, tienda y vendedor de ejemplo).
# APP_SEED_DEMO_DATA=false lo desactiva en producción.
app.seed.demo-data=${APP_SEED_DEMO_DATA:true}

# ----------------------------------------------------------------------------
# Actuator: health check usado por la plataforma de despliegue
# ----------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# El correo es opcional: sin SMTP configurado el health check no debe tumbarlo.
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}


# ----------------------------------------------------------------------------
# Retiros de vendedores
# ----------------------------------------------------------------------------
# Valor mínimo de retiro y comisión de ParDrops por transferencia bancaria.
# La comisión bancaria externa es 0 por defecto y se configura aquí si aplica.
app.withdrawals.min-amount=${WITHDRAWAL_MIN_AMOUNT:50000}
app.withdrawals.bank-fee=${WITHDRAWAL_BANK_FEE:0}

# Tiempos de espera del SMTP para no bloquear la peticion si el proveedor no responde.
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_READ_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:10000}

# Transporte de correo: smtp (por defecto) o api (HTTPS de Brevo).
# Render bloquea el puerto 587 en instancias gratuitas, asi que en produccion
# se usa la API por HTTPS. Requiere BREVO_API_KEY.
app.mail.transport=${MAIL_TRANSPORT:smtp}
app.mail.brevo-api-key=${BREVO_API_KEY:}

# Correo de atención mostrado en los mensajes a los clientes.
app.mail.support-email=${MAIL_SUPPORT_EMAIL:soporte@pardrops.com}

# ----------------------------------------------------------------------------
# Wompi (pagos)
# ----------------------------------------------------------------------------
# Sandbox y Producción son ambientes independientes. Las llaves privadas y los
# secretos solo se leen del entorno y nunca se versionan ni se registran.
# El checkout recibe únicamente la llave pública del ambiente activo.
app.wompi.env=${WOMPI_ENV:sandbox}
app.wompi.currency=${WOMPI_CURRENCY:COP}
app.wompi.fixed-fee-cop=${WOMPI_FIXED_FEE_COP:700}
app.wompi.result-path=/compra
# URL pública del frontend a la que Wompi devuelve al comprador. Debe ser HTTPS.
app.wompi.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}

app.wompi.test.public-key=${WOMPI_TEST_PUBLIC_KEY:}
app.wompi.test.private-key=${WOMPI_TEST_PRIVATE_KEY:}
app.wompi.test.events-secret=${WOMPI_TEST_EVENTS_SECRET:}
app.wompi.test.integrity-secret=${WOMPI_TEST_INTEGRITY_SECRET:}

app.wompi.prod.public-key=${WOMPI_PROD_PUBLIC_KEY:}
app.wompi.prod.private-key=${WOMPI_PROD_PRIVATE_KEY:}
app.wompi.prod.events-secret=${WOMPI_PROD_EVENTS_SECRET:}
app.wompi.prod.integrity-secret=${WOMPI_PROD_INTEGRITY_SECRET:}
