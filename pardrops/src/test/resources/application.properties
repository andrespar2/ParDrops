# ============================================================================
# Configuración usada SOLO en las pruebas automatizadas
# ============================================================================
# Las pruebas no deben tocar la base de datos de desarrollo (./data). Por eso
# aquí se usa una base H2 en memoria que se crea y se destruye en cada
# ejecución, y el esquema se genera desde cero con las entidades actuales.

spring.datasource.url=jdbc:h2:mem:pardrops-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=false

# Clave de firma propia de las pruebas (no es ningún secreto real).
app.jwt.secret=ClaveSecretaDeLasPruebasDeParDrops2026NoUsarEnProduccion
app.jwt.expiration-ms=86400000

app.cors.allowed-origins=http://localhost:4200

# Plazo de reintento tras un rechazo (días).
app.seller-application.retry-days=7
