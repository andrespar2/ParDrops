<main class="page">
  <div class="container">
    <div class="not-found">
      <div class="not-found__code">404</div>
      <h1 class="not-found__title">Página no encontrada</h1>
      <p class="not-found__description">
        Lo sentimos, no hemos podido encontrar la página que estás buscando.
      </p>
      <div class="not-found__actions">
        <a routerLink="/" class="not-found__button not-found__button--primary">
          Ir a inicio
        </a>
        <a routerLink="/productos" class="not-found__button not-found__button--secondary">
          Ver productos
        </a>
      </div>
    </div>
  </div>
</main>
