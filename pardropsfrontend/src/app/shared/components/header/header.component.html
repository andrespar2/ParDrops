<!-- 
  @file src/app/shared/components/header/header.component.html
  @description Plantilla HTML del componente de cabecera.
  
  Estructura: Logo, navegación, buscador y carrito.
  Diseño responsive con menú móvil.
-->

<header class="header">
  <nav class="nav container">
    <!-- Logo/Marca -->
    <div class="nav__brand">
      <a routerLink="/" class="nav__logo" (click)="closeMobileMenu()">
        ParDrops
      </a>
    </div>

    <!-- Botón menú móvil -->
    <button 
      class="nav__toggle" 
      type="button"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="isMobileMenuOpen"
      aria-label="Abrir menú de navegación"
    >
      <span class="nav__toggle-bar"></span>
      <span class="nav__toggle-bar"></span>
      <span class="nav__toggle-bar"></span>
    </button>

    <!-- Menú de navegación -->
    <ul class="nav__menu" [class.nav__menu--open]="isMobileMenuOpen">
      <li class="nav__item">
        <a 
          routerLink="/" 
          routerLinkActive="nav__link--active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav__link"
          (click)="closeMobileMenu()"
        >
          Inicio
        </a>
      </li>
      <li class="nav__item">
        <a 
          routerLink="/productos" 
          routerLinkActive="nav__link--active"
          class="nav__link"
          (click)="closeMobileMenu()"
        >
          Productos
        </a>
      </li>
      <li class="nav__item">
        <a 
          routerLink="/productos" 
          [queryParams]="{ filter: 'nuevos' }"
          class="nav__link nav__link--secondary"
          (click)="closeMobileMenu()"
        >
          Nuevos
        </a>
      </li>
      <li class="nav__item">
        <a 
          routerLink="/productos" 
          [queryParams]="{ filter: 'ofertas' }"
          class="nav__link nav__link--secondary"
          (click)="closeMobileMenu()"
        >
          Ofertas
        </a>
      </li>
    </ul>

    <!-- Acciones: carrito -->
    <div class="nav__actions">
      <a 
        routerLink="/carrito" 
        class="nav__cart"
        (click)="closeMobileMenu()"
        aria-label="Ver carrito de compras"
      >
        <svg 
          class="nav__cart-icon" 
          width="24" 
          height="24" 
          viewBox="0 0 24 24" 
          fill="none" 
          stroke="currentColor" 
          stroke-width="2" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39A2 2 0 0 0 9.66 17h8.66a2 2 0 0 0 1.97-1.61L23 6H6"></path>
        </svg>
        @if (itemCount() > 0) {
          <span class="nav__cart-badge">{{ itemCount() }}</span>
        }
      </a>
    </div>
  </nav>
</header>
