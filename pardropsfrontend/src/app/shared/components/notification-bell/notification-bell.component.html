<!--
  @file src/app/shared/components/notification-bell/notification-bell.component.html
  @description Plantilla HTML de la campanilla de notificaciones.

  Muestra el icono de campana con el contador de avisos sin leer y el
  desplegable con los últimos avisos.
-->

<div class="bell">
  <button
    type="button"
    class="bell__button"
    (click)="toggle()"
    [attr.aria-expanded]="isOpen()"
    aria-label="Notificaciones"
  >
    <svg
      class="bell__icon"
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
    </svg>
    @if (unreadCount() > 0) {
      <span class="bell__badge">{{ unreadCount() }}</span>
    }
  </button>

  @if (isOpen()) {
    <div class="bell__panel">
      <div class="bell__header">
        <h2 class="bell__title">Notificaciones</h2>
        @if (unreadCount() > 0) {
          <button type="button" class="bell__action" (click)="markAllAsRead()">
            Marcar todas como leídas
          </button>
        }
      </div>

      @if (notifications().length === 0) {
        <p class="bell__empty">No tienes notificaciones todavía.</p>
      } @else {
        <ul class="bell__list">
          @for (notification of notifications(); track notification.id) {
            <li
              class="bell__item"
              [class.bell__item--unread]="!notification.read"
            >
              <button
                type="button"
                class="bell__item-button"
                (click)="openNotification(notification.id, notification.link)"
              >
                <span class="bell__item-title">{{ notification.title }}</span>
                <span class="bell__item-message">{{ notification.message }}</span>
              </button>
            </li>
          }
        </ul>
      }

      <a routerLink="/notificaciones" class="bell__footer" (click)="close()">
        Ver todas las notificaciones
      </a>
    </div>
  }
</div>
