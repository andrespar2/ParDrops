<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>ParDrops — Compra y vende</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Compra y vende productos en ParDrops. Encuentra lo que buscas y publica lo que ya no usas.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://images.unsplash.com">
  <!-- Aplica el tema guardado antes de renderizar para evitar el destello. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('pardrops_theme') || 'system';
        var dark = stored === 'dark' ||
          (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <!-- Configuración de ejecución: se sustituye en el despliegue sin recompilar. -->
  <script src="config.js"></script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
